<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Suspended</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
      max-width: 520px;
      width: 100%;
      overflow: hidden;
    }
    .banner {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      padding: 32px;
      text-align: center;
    }
    .banner .icon {
      font-size: 56px;
      margin-bottom: 12px;
    }
    .banner h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
    }
    .banner p {
      color: #fca5a5;
      font-size: 14px;
      margin-top: 6px;
    }
    .body {
      padding: 32px;
      text-align: center;
    }
    .body p {
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #2563eb;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="icon">⚠️</div>
      <h1>Account Suspended</h1>
      <p>Kuota hosting telah habis</p>
    </div>
    <div class="body">
      <p>
        Akun hosting <strong>PT. Milia Kreastika Persada</strong> saat ini 
        dinonaktifkan karena kuota hosting telah mencapai batas maksimal.
      </p>
      <p style="margin-top: 8px;">
        Silakan perpanjang masa aktif hosting untuk mengembalikan akses website.
      </p>
      <button class="btn" onclick="alert('Silakan hubungi admin untuk perpanjangan.')">Perpanjang Sekarang</button>
    </div>
  </div>
</body>
</html>
